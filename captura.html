<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Registrar Rostro - Registro de Personal</title>
<script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif; background: #f1f5f9; color: #1e293b; }
  .wrap { max-width: 460px; margin: 0 auto; padding: 20px 16px 40px; }
  h1 { font-size: 15px; text-transform: uppercase; letter-spacing: .5px; color: #334155; text-align: center; margin: 10px 0 18px; }
  .card { background: #fff; border-radius: 12px; padding: 18px; box-shadow: 0 1px 3px rgba(0,0,0,.06); margin-bottom: 16px; }
  label { display: block; font-size: 12px; color: #64748b; margin-bottom: 4px; margin-top: 12px; }
  label:first-child { margin-top: 0; }
  select { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; font-family: inherit; }
  .video-wrap { position: relative; width: 100%; max-width: 320px; margin: 14px auto; border-radius: 10px; overflow: hidden; background: #0f172a; aspect-ratio: 4/3; }
  .video-wrap video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
  .status { text-align: center; font-size: 13px; color: #64748b; min-height: 18px; margin-top: 6px; }
  .status.ok { color: #047857; font-weight: 700; }
  .status.warn { color: #b45309; font-weight: 600; }
  .status.err { color: #e11d48; font-weight: 600; }
  button { cursor: pointer; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; padding: 11px 14px; font-family: inherit; width: 100%; }
  button:disabled { background: #cbd5e1 !important; cursor: not-allowed; }
  .btn-primary { background: #1e293b; color: #fff; }
  .btn-danger { background: #fef2f2; color: #e11d48; margin-top: 8px; }
  .row2 { display: flex; gap: 8px; margin-top: 10px; }
  .row2 button { flex: 1; }
  .pill { display: inline-block; font-size: 11px; padding: 3px 9px; border-radius: 999px; margin-top: 6px; }
  .pill-green { background: #ecfdf5; color: #047857; }
  .pill-gray { background: #f1f5f9; color: #64748b; }
  .cfgnote { font-size: 11px; color: #94a3b8; text-align: center; margin-top: 14px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Registrar Rostro de Empleado</h1>

  <div class="card">
    <label for="empresaSelect">Empresa</label>
    <select id="empresaSelect"></select>

    <label for="empleadoSelect">Empleado</label>
    <select id="empleadoSelect" disabled></select>
    <div id="estadoActual" class="pill pill-gray" style="display:none;"></div>

    <div class="video-wrap">
      <video id="video" autoplay muted playsinline></video>
    </div>
    <div class="status" id="status">Selecciona empresa y empleado para comenzar.</div>

    <button class="btn-primary" id="toggleBtn" disabled>Activar cámara</button>
    <div class="row2" id="captureRow" style="display:none;">
      <button class="btn-primary" id="shotBtn">Tomar foto y guardar</button>
    </div>
    <button class="btn-danger" id="clearBtn" style="display:none;">Quitar rostro registrado</button>
  </div>

  <div class="cfgnote">
    Backend: <span id="urlLabel">sin configurar</span> ·
    <a href="index-facial.html" style="color:#94a3b8;">Ir al reconocimiento</a>
  </div>
</div>

<script>
  // =====================================================================
  // CONFIGURACION: pega aqui la misma URL de tu Web App de Apps Script
  // (la misma que usaste en index.html)
  // =====================================================================
  const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyZVzV_VAwL-r1rGLJdC-ZzkIeeIyUDFILXvU-lxtHbU3XaQRFU3tjYR8OjVb99bHrU/exec';
  // =====================================================================

  const FACE_MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model';

  let empleadosCache = [];
  let modelsReady = false;
  let stream = null;

  const statusEl = document.getElementById('status');
  const toggleBtn = document.getElementById('toggleBtn');
  const shotBtn = document.getElementById('shotBtn');
  const clearBtn = document.getElementById('clearBtn');
  const captureRow = document.getElementById('captureRow');
  const empresaSelect = document.getElementById('empresaSelect');
  const empleadoSelect = document.getElementById('empleadoSelect');
  const estadoActual = document.getElementById('estadoActual');
  const video = document.getElementById('video');

  document.getElementById('urlLabel').textContent = APPS_SCRIPT_URL.indexOf('PEGA_AQUI') === -1 ? 'configurado' : 'sin configurar';

  function setStatus(msg, cls) {
    statusEl.className = 'status' + (cls ? ' ' + cls : '');
    statusEl.textContent = msg;
  }

  async function callBackend(payload) {
    if (APPS_SCRIPT_URL.indexOf('PEGA_AQUI') !== -1) throw new Error('Falta configurar APPS_SCRIPT_URL en este archivo.');
    const res = await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload),
    });
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || 'Error desconocido del servidor.');
    return data;
  }

  async function cargarEmpresas() {
    setStatus('Cargando empresas...', '');
    try {
      const data = await callBackend({ action: 'getCompanies' });
      empresaSelect.innerHTML = '';
      data.companies.forEach(function (c) {
        const opt = document.createElement('option');
        opt.value = c.id; opt.textContent = c.nombre;
        empresaSelect.appendChild(opt);
      });
      if (data.companies.length === 0) { setStatus('No hay empresas configuradas todavía.', 'warn'); return; }
      await cargarEmpleados();
    } catch (e) {
      setStatus('No se pudo conectar con el backend: ' + e.message, 'err');
    }
  }

  async function cargarEmpleados() {
    const empresaId = empresaSelect.value;
    if (!empresaId) return;
    setStatus('Cargando empleados...', '');
    detenerCamara();
    try {
      const data = await callBackend({ action: 'getEmployeesForCapture', empresaId: empresaId });
      empleadosCache = data.empleados;
      empleadoSelect.innerHTML = '';
      empleadosCache.forEach(function (e) {
        const opt = document.createElement('option');
        opt.value = e.id;
        opt.textContent = e.nombre + ' (' + e.documento + ')' + (e.tieneRostro ? ' ✓' : '');
        empleadoSelect.appendChild(opt);
      });
      empleadoSelect.disabled = empleadosCache.length === 0;
      setStatus(empleadosCache.length ? 'Selecciona un empleado.' : 'No hay empleados en esta empresa.', empleadosCache.length ? '' : 'warn');
      actualizarEstadoEmpleado();
    } catch (e) {
      setStatus('Error cargando empleados: ' + e.message, 'err');
    }
  }
  empresaSelect.addEventListener('change', cargarEmpleados);
  empleadoSelect.addEventListener('change', function () { detenerCamara(); actualizarEstadoEmpleado(); });

  function empleadoActual() {
    return empleadosCache.find(function (e) { return String(e.id) === String(empleadoSelect.value); }) || null;
  }

  function actualizarEstadoEmpleado() {
    const emp = empleadoActual();
    toggleBtn.disabled = !emp;
    if (!emp) { estadoActual.style.display = 'none'; clearBtn.style.display = 'none'; return; }
    estadoActual.style.display = 'inline-block';
    if (emp.tieneRostro) {
      estadoActual.textContent = 'Rostro ya registrado';
      estadoActual.className = 'pill pill-green';
      clearBtn.style.display = 'block';
    } else {
      estadoActual.textContent = 'Sin rostro registrado';
      estadoActual.className = 'pill pill-gray';
      clearBtn.style.display = 'none';
    }
    setStatus('Listo para capturar el rostro de ' + emp.nombre + '.', '');
  }

  async function asegurarModelos() {
    if (modelsReady) return true;
    setStatus('Descargando modelo de reconocimiento (solo la primera vez)...', '');
    try {
      await faceapi.nets.tinyFaceDetector.loadFromUri(FACE_MODEL_URL);
      await faceapi.nets.faceLandmark68Net.loadFromUri(FACE_MODEL_URL);
      await faceapi.nets.faceRecognitionNet.loadFromUri(FACE_MODEL_URL);
      modelsReady = true;
      return true;
    } catch (e) {
      setStatus('No se pudo cargar el modelo de reconocimiento. Revisa tu conexión.', 'err');
      return false;
    }
  }

  async function iniciarCamara() {
    const ok = await asegurarModelos();
    if (!ok) return;
    try {
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false });
    } catch (e) {
      setStatus('No se pudo acceder a la cámara. Revisa los permisos del navegador.', 'err');
      return;
    }
    video.srcObject = stream;
    toggleBtn.textContent = 'Detener cámara';
    captureRow.style.display = 'flex';
    empresaSelect.disabled = true;
    empleadoSelect.disabled = true;
    setStatus('Centra el rostro en el recuadro y toma la foto.', '');
  }

  function detenerCamara() {
    if (stream) { stream.getTracks().forEach(function (t) { t.stop(); }); stream = null; }
    video.srcObject = null;
    toggleBtn.textContent = 'Activar cámara';
    captureRow.style.display = 'none';
    empresaSelect.disabled = false;
    empleadoSelect.disabled = false;
  }

  toggleBtn.addEventListener('click', function () {
    if (stream) detenerCamara(); else iniciarCamara();
  });

  shotBtn.addEventListener('click', async function () {
    const emp = empleadoActual();
    if (!emp) return;
    setStatus('Analizando rostro...', '');
    shotBtn.disabled = true;
    try {
      const opciones = new faceapi.TinyFaceDetectorOptions({ inputSize: 320, scoreThreshold: 0.5 });
      const det = await faceapi.detectSingleFace(video, opciones).withFaceLandmarks().withFaceDescriptor();
      if (!det) {
        setStatus('No se detectó un rostro claro. Intenta con mejor luz.', 'warn');
        shotBtn.disabled = false;
        return;
      }
      const descriptor = Array.from(det.descriptor);
      const data = await callBackend({
        action: 'guardarRostroEmpleado',
        empresaId: empresaSelect.value,
        empleadoId: emp.id,
        descriptor: descriptor,
      });
      setStatus('✅ Rostro guardado para ' + data.nombre + '.', 'ok');
      detenerCamara();
      await cargarEmpleados();
      empleadoSelect.value = emp.id;
      actualizarEstadoEmpleado();
    } catch (e) {
      setStatus('No se pudo guardar: ' + e.message, 'err');
    } finally {
      shotBtn.disabled = false;
    }
  });

  clearBtn.addEventListener('click', async function () {
    const emp = empleadoActual();
    if (!emp) return;
    if (!confirm('¿Quitar el rostro registrado de ' + emp.nombre + '?')) return;
    setStatus('Quitando rostro...', '');
    try {
      const data = await callBackend({ action: 'guardarRostroEmpleado', empresaId: empresaSelect.value, empleadoId: emp.id, descriptor: null });
      setStatus('Rostro eliminado para ' + data.nombre + '.', 'ok');
      await cargarEmpleados();
      empleadoSelect.value = emp.id;
      actualizarEstadoEmpleado();
    } catch (e) {
      setStatus('No se pudo quitar: ' + e.message, 'err');
    }
  });

  cargarEmpresas();
</script>
</body>
</html>
